name: Apply issue blog and Mermaid fixes

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: one-time-issue-blog-fix
  cancel-in-progress: false

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Check out this repository
        uses: actions/checkout@v6

      - name: Apply the fixes from the template ZIP
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile
          import re

          root = Path.cwd().resolve()
          archive = root / "Beyond-errors-Hugo-template-v4.zip"
          prefix = "beyond-errors-hugo-issue-blog/"
          if not archive.is_file():
              raise SystemExit("Upload Beyond-errors-Hugo-template-v4.zip to the repository root.")
          config = root / "hugo.toml"
          if not config.is_file():
              raise SystemExit("hugo.toml was not found at the repository root.")
          match = re.search(r"^\s*theme\s*=\s*['\"]([^'\"]+)['\"]", config.read_text(encoding="utf-8"), re.M)
          if not match:
              raise SystemExit("Could not determine the configured Hugo theme from hugo.toml.")
          theme_dir = root / "themes" / match.group(1)
          if not theme_dir.is_dir():
              raise SystemExit("The configured theme directory was not found.")

          mapping = {
              prefix + ".github/scripts/sync-private-issues.mjs": root / ".github/scripts/sync-private-issues.mjs",
              prefix + "themes/beyond-errors/static/enhancements.js": theme_dir / "static/enhancements.js",
              prefix + "themes/beyond-errors/static/style.css": theme_dir / "static/style.css",
          }
          with ZipFile(archive) as package:
              names = set(package.namelist())
              if any(name not in names for name in mapping):
                  raise SystemExit("The ZIP is missing one or more required fix files.")
              for name, destination in mapping.items():
                  destination.parent.mkdir(parents=True, exist_ok=True)
                  destination.write_bytes(package.read(name))
          print("Applied sub-issue publishing and Mermaid Gantt fixes.")
          PY

      - name: Commit the patch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/scripts/sync-private-issues.mjs themes
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "Add sub-issue publishing and fix Gantt chart labels"
          git push origin "HEAD:${GITHUB_REF_NAME}"
