name: Publish private issues with Hugo

on:
  schedule:
    - cron: '0 12 * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out the public Hugo site
        uses: actions/checkout@v6

      - name: Restore private snapshot fingerprint
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/issue-sync-state
          key: issue-sync-state-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            issue-sync-state-

      - name: Read private issues without printing their contents
        id: sync
        env:
          ISSUE_SOURCE_OWNER: ${{ secrets.ISSUE_SOURCE_OWNER }}
          ISSUE_SOURCE_REPO: ${{ secrets.ISSUE_SOURCE_REPO }}
          ISSUE_SOURCE_TOKEN: ${{ secrets.ISSUE_SOURCE_TOKEN }}
          SYNC_HMAC_KEY: ${{ secrets.SYNC_HMAC_KEY }}
        run: node .github/scripts/sync-private-issues.mjs

      - name: Configure GitHub Pages
        if: steps.sync.outputs.changed == 'true'
        uses: actions/configure-pages@v5

      - name: Install Hugo
        if: steps.sync.outputs.changed == 'true'
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: '0.169.0'
          extended: true

      - name: Render the site in temporary storage
        if: steps.sync.outputs.changed == 'true'
        env:
          SITE_BASE_URL: ${{ vars.SITE_BASE_URL }}
        shell: bash
        run: |
          set +x
          set -euo pipefail
          content_dir="$RUNNER_TEMP/hugo-content"
          issue_dir="$RUNNER_TEMP/issue-sync-content"
          site_dir="$RUNNER_TEMP/site-dist"
          log_file="$RUNNER_TEMP/hugo-build.log"
          trap 'rm -rf "$content_dir" "$issue_dir" "$log_file"' EXIT
          if [[ -z "${SITE_BASE_URL:-}" ]]; then
            echo 'SITE_BASE_URL is not configured.' >&2
            exit 1
          fi
          mkdir -p "$content_dir/posts"
          cp -a content/. "$content_dir/"
          find "$issue_dir" -maxdepth 1 -type f -name '*.md' -exec cp {} "$content_dir/posts/" \;
          if ! hugo --minify --baseURL "$SITE_BASE_URL" --contentDir "$content_dir" --destination "$site_dir" >"$log_file" 2>&1; then
            echo 'Hugo rendering failed; build output was suppressed.' >&2
            exit 1
          fi

      - name: Upload the rendered website
        if: steps.sync.outputs.changed == 'true'
        uses: actions/upload-pages-artifact@v4
        with:
          path: ${{ runner.temp }}/site-dist

      - name: Deploy the rendered website
        if: steps.sync.outputs.changed == 'true'
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Save the fingerprint only after a successful publication
        if: success() && steps.sync.outputs.changed == 'true'
        shell: bash
        run: |
          set +x
          mkdir -p "$RUNNER_TEMP/issue-sync-state"
          cp "$RUNNER_TEMP/issue-sync-candidate" "$RUNNER_TEMP/issue-sync-state/snapshot.hmac"

      - name: Cache the private snapshot fingerprint
        if: success() && steps.sync.outcome == 'success'
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/issue-sync-state
          key: issue-sync-state-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Remove temporary issue content and fingerprint candidate
        if: always()
        shell: bash
        run: |
          set +x
          rm -rf "$RUNNER_TEMP/issue-sync-content" "$RUNNER_TEMP/issue-sync-candidate" "$RUNNER_TEMP/hugo-content" "$RUNNER_TEMP/hugo-build.log"
